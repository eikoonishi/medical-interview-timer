<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Web Audio テスト（iPad）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#000; --mute:#6b7280; --line:#e5e7eb; --panel:#f7f8fa;
  --ok:#15803d; --ng:#d97706; --sans:"Noto Sans JP",-apple-system,system-ui,sans-serif;
  color-scheme: light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:21px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:18px}
.box{border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.box h2{font-size:16px;font-weight:700;margin-bottom:6px}
.desc{font-size:12.5px;color:var(--mute);margin-bottom:12px;line-height:1.6}
.btn{font-family:inherit;font-size:18px;font-weight:700;padding:18px 22px;border-radius:12px;
  border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;min-height:60px;width:100%}
.btn:active{opacity:.75}
.btn[disabled]{opacity:.4}
.btn.sm{font-size:14px;padding:10px 14px;min-height:46px;width:auto;border-color:var(--line);background:#fff;color:var(--ink)}
.state{font-size:26px;font-weight:700;text-align:center;margin:16px 0;line-height:1.4}
.state small{font-size:13px;font-weight:500;color:var(--mute);display:block;margin-top:4px}
.state.ok{color:var(--ok)}
.state.ng{color:var(--ng)}
.steps{display:grid;gap:8px;margin-top:8px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;
  font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.step .n{font-weight:700;color:var(--mute)}
.step .r{font-weight:700;white-space:nowrap}
.step .r.ok{color:var(--ok)}
.step .r.ng{color:var(--ng)}
pre{margin-top:12px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.8;
  white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <h1>Web Audio テスト</h1>
  <div class="sub">これが通れば、12月版はこの方式で作ります　<span id="ver"></span></div>

  <div class="box">
    <h2>やること</h2>
    <div class="desc">
      音声を「要素」ではなく「データ」として持つ方式を試します。<br>
      <b>ボタンを押したら、60秒間 iPad に触らないでください。</b>画面も消さないでください。<br>
      押した直後に「ポン」と1回鳴り、そのあと静かになります。
    </div>
    <button class="btn" id="go">テストを開始する</button>
    <div class="state" id="state"></div>
    <div class="steps">
      <div class="step"><span class="n">1</span><span>音声の仕組みを起動（タップ中）</span><span class="r" id="s1">—</span></div>
      <div class="step"><span class="n">2</span><span>「ポン」が鳴る</span><span class="r" id="s2">—</span></div>
      <div class="step"><span class="n">3</span><span>音声データを読み込む</span><span class="r" id="s3">—</span></div>
      <div class="step"><span class="n">4</span><span>60秒待つ（触らない）</span><span class="r" id="s4">—</span></div>
      <div class="step"><span class="n">5</span><span><b>60秒後に自動で鳴るか</b></span><span class="r" id="s5">—</span></div>
    </div>
  </div>

  <div class="box">
    <h2>詳しい記録</h2>
    <div class="desc">この内容をそのまま送ってください。</div>
    <pre id="log">まだ実行していません。</pre>
    <button class="btn sm" id="copy">記録をコピー</button>
  </div>
</div>

<script>
const V = "20261006c";
const BASE = "/postosce6/sounds/";
const TARGET = "check_all";     // 本番と同じ長い音声（3分40秒）
const WAIT_SEC = 60;

const $ = id => document.getElementById(id);
const L = [];
const log = s => { L.push(s); $("log").textContent = L.join("\n"); };
const wait = ms => new Promise(r=>setTimeout(r, ms));
function step(id, ok, txt){
  const el = $(id);
  el.textContent = txt || (ok === null ? "…" : ok ? "◯" : "✗");
  el.className = "r " + (ok === null ? "" : ok ? "ok" : "ng");
}
function state(txt, cls){ $("state").textContent = txt; $("state").className = "state " + (cls||""); }

let ctx = null, buf = null, src = null;

$("go").onclick = async ()=>{
  $("go").disabled = true;
  L.length = 0;
  log("=== Web Audio テスト ===");
  log("日時　： " + new Date().toLocaleString());
  log("端末　： " + navigator.userAgent);
  log("");

  // ---- 1. タップの中で AudioContext を起こす（ここが肝）----
  step("s1", null);
  try{
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") await ctx.resume();
    step("s1", ctx.state === "running", ctx.state);
    log("1. 起動　　： " + ctx.state + "  (" + ctx.sampleRate + "Hz)");
  }catch(e){
    step("s1", false); log("1. 起動　　： 失敗 " + e);
    state("起動できませんでした", "ng"); $("go").disabled = false; return;
  }

  // ---- 2. タップの中で短い音を鳴らす（起動の確認）----
  step("s2", null);
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = 0.25;
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.18);
    await wait(400);
    step("s2", ctx.state === "running");
    log("2. 試し音　： " + (ctx.state === "running" ? "鳴らしました" : "状態 " + ctx.state));
  }catch(e){ step("s2", false); log("2. 試し音　： 失敗 " + e); }

  // ---- 3. 音声データを読み込む ----
  step("s3", null);
  state("音声を読み込んでいます…");
  const t0 = Date.now();
  try{
    const res = await fetch(BASE + TARGET + ".mp3?v=" + V);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const ab = await res.arrayBuffer();
    log("3. 取得　　： " + (ab.byteLength/1048576).toFixed(2) + "MB  (" + ((Date.now()-t0)/1000).toFixed(1) + "秒)");
    const d0 = Date.now();
    buf = await new Promise((ok, ng)=>{
      let done = false;
      const t = setTimeout(()=>{ if(!done){ done = true; ng(new Error("デコードが30秒で終わらない")); } }, 30000);
      ctx.decodeAudioData(ab,
        b => { if(!done){ done = true; clearTimeout(t); ok(b); } },
        e => { if(!done){ done = true; clearTimeout(t); ng(e || new Error("デコード失敗")); } });
    });
    step("s3", true, (buf.duration).toFixed(0) + "秒");
    log("3. 展開　　： " + buf.duration.toFixed(1) + "秒  "
        + (buf.length * 4 / 1048576).toFixed(0) + "MB  (" + ((Date.now()-d0)/1000).toFixed(1) + "秒)");
  }catch(e){
    step("s3", false);
    log("3. 読み込み： 失敗 " + (e && e.message ? e.message : e));
    state("音声を読み込めませんでした", "ng");
    $("go").disabled = false; return;
  }

  // ---- 4. 60秒待つ ----
  step("s4", null);
  log("");
  log("--- " + WAIT_SEC + "秒待ちます（触らないでください）---");
  for(let i = WAIT_SEC; i > 0; i--){
    state(i + "秒", "");
    $("state").innerHTML = i + "<small>秒後に自動で鳴ります。触らずにお待ちください</small>";
    await wait(1000);
  }
  step("s4", true);

  // ---- 5. 自動再生（ここが本題）----
  step("s5", null);
  state("再生中…");
  try{
    log("");
    log("5. 自動再生を試みます（" + new Date().toLocaleTimeString() + "）");
    if(ctx.state === "suspended"){
      log("　　※ 状態が suspended。resume を試みます");
      try{ await ctx.resume(); }catch(e){}
    }
    log("　　状態： " + ctx.state);
    src = ctx.createBufferSource();
    const g = ctx.createGain(); g.gain.value = 0.5;
    src.buffer = buf;
    src.connect(g).connect(ctx.destination);
    const a0 = ctx.currentTime;
    src.start();
    await wait(3000);
    const adv = ctx.currentTime - a0;
    const ok = ctx.state === "running" && adv > 1.5;
    step("s5", ok);
    log("　　結果： " + (ok ? "鳴りました" : "鳴りません") + "　進んだ時間 " + adv.toFixed(2) + "秒　状態 " + ctx.state);
    if(ok){
      state("◯ 鳴りました", "ok");
      log("");
      log("そのまま3分40秒、最後まで流れるか聞いてください。");
      log("途中で止めたいときは画面を閉じてください。");
    }else{
      state("✗ 鳴りませんでした", "ng");
      try{ src.stop(); }catch(e){}
    }
  }catch(e){
    step("s5", false);
    log("　　結果： 失敗 " + e);
    state("✗ 鳴りませんでした", "ng");
  }

  log("");
  log("=== 終了。この記録を送ってください ===");
  $("go").disabled = false;
};

$("ver").textContent = "版 " + V;
$("copy").onclick = ()=>{
  const t = L.join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>{
      $("copy").textContent = "コピーしました";
      setTimeout(()=>$("copy").textContent = "記録をコピー", 1800);
    }).catch(()=>{});
  }
};
</script>
</body>
</html>
