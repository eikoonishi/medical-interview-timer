<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="医療面接タイマー β">
<meta name="theme-color" content="#ffffff">
<title>東北大学医学部 医療面接タイマー（β）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f7f7f8;
    color: #111;
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 20px 60px;
  }
  .container { max-width: 960px; margin: 0 auto; position: relative; }

  .clock {
    position: absolute;
    top: 0;
    right: 0;
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 700;
    color: #333;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    background: #fff;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    padding: 6px 12px;
    letter-spacing: 0.04em;
  }

  header { text-align: center; margin-bottom: 20px; padding-top: 6px; }
  h1 {
    font-size: clamp(22px, 3.2vw, 32px);
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.04em;
  }
  .set-line {
    margin-top: 8px;
    font-size: clamp(16px, 2vw, 20px);
    color: #444;
    font-weight: 500;
  }
  .set-line .num { font-weight: 900; color: #111; }
  .set-line .phase {
    margin-left: 14px;
    padding: 3px 10px;
    background: #111;
    color: #fff;
    border-radius: 999px;
    font-size: 0.85em;
    font-weight: 700;
  }
  .set-line .phase.idle { background: #888; }
  .set-line .phase.scheduled { background: #6366f1; }
  .set-line .phase.prep { background: #2563eb; }
  .set-line .phase.interview { background: #059669; }
  .set-line .phase.feedback { background: #d97706; }
  .set-line .phase.done { background: #444; }

  .timers {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 24px;
  }
  .timer-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    border: 2px solid #ddd;
    border-radius: 16px;
    padding: 18px 24px;
    background: #fff;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .timer-row .label {
    font-size: clamp(18px, 2.4vw, 24px);
    font-weight: 700;
    color: #333;
  }
  .timer-row .sub {
    display: block;
    font-size: 0.7em;
    color: #888;
    font-weight: 500;
    margin-top: 2px;
  }
  .timer-row .time {
    font-size: clamp(40px, 7vw, 64px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: #555;
    user-select: none;
    -webkit-user-select: none;
  }
  .timer-row .time .unit {
    font-size: 0.45em;
    font-weight: 500;
    color: #888;
    margin: 0 2px;
  }
  .timer-row.active {
    border-color: #111;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .timer-row.active .label { color: #111; }
  .timer-row.active .time { color: #111; }
  .timer-row.active.warning .time { color: #d97706; }
  .timer-row.active.warning { border-color: #d97706; background: #fffaf0; }

  /* β版：フィードバック中の控えめプログレスバー */
  .fb-bar {
    display: none;
    width: 100%;
    height: 10px;
    background: #eef2f5;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 14px;
  }
  .fb-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #a3b1c2, #64748b);
    border-radius: 999px;
    transition: width 0.6s linear;
  }
  /* フィードバックフェーズ中はカウントダウンを隠してバーを出す */
  .timer-row.fb-mode { display: block; }
  .timer-row.fb-mode .label {
    font-size: clamp(20px, 2.8vw, 28px);
    color: #111;
  }
  .timer-row.fb-mode .label .sub { color: #64748b; font-weight: 500; }
  .timer-row.fb-mode .time { display: none; }
  .timer-row.fb-mode .fb-bar { display: block; }
  /* β版ではFB行の警告色（オレンジ）は出さない */
  .timer-row.fb-mode.warning { border-color: #ddd; background: #fff; }
  .timer-row.fb-mode.warning .time { color: inherit; }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 8px;
  }
  .start-scheduled {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-items: stretch;
  }
  .time-wheels {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #fff;
    border: 2px solid #ccc;
    border-radius: 16px;
    padding: 10px 16px 6px;
    user-select: none;
    -webkit-user-select: none;
  }
  .wheel-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .wheel-col::before {
    content: '';
    position: absolute;
    top: 48px;
    left: 4px;
    right: 4px;
    height: 48px;
    background: rgba(0,0,0,0.05);
    border-radius: 10px;
    pointer-events: none;
    z-index: 0;
  }
  .wheel {
    height: 144px;
    width: 84px;
    overflow-y: scroll;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 30%, black 70%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, black 30%, black 70%, transparent 100%);
    position: relative;
    z-index: 1;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel-list {
    padding: 48px 0;
  }
  .wheel-item {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: 24px;
    font-weight: 600;
    color: #aaa;
    transition: color 0.18s, font-size 0.18s, font-weight 0.18s;
    cursor: pointer;
  }
  .wheel-item.selected {
    color: #111;
    font-size: 32px;
    font-weight: 800;
  }
  .wheel-label {
    font-size: 11px;
    color: #666;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .wheel-colon {
    font-size: clamp(28px, 3.4vw, 36px);
    font-weight: 800;
    color: #333;
    align-self: flex-start;
    margin-top: 56px;
    padding: 0 2px;
  }
  .time-wheels.disabled { opacity: 0.55; pointer-events: none; }
  .ctrl-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .until-info {
    text-align: center;
    font-size: clamp(13px, 1.6vw, 15px);
    color: #2563eb;
    font-weight: 600;
    margin: -4px 0 0;
    min-height: 1.2em;
  }
  .btn {
    padding: 22px 16px;
    font-size: clamp(16px, 2.2vw, 20px);
    font-weight: 700;
    font-family: inherit;
    border-radius: 14px;
    border: 2px solid #111;
    background: #fff;
    color: #111;
    cursor: pointer;
    transition: transform 0.05s, background 0.15s, color 0.15s, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: #111; color: #fff; }
  .btn.primary:hover { background: #333; }
  .btn.secondary:hover { background: #f0f0f0; }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .hint {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin: 4px 0 24px;
  }

  .jump {
    border-top: 1px solid #ddd;
    padding-top: 20px;
    margin-top: 24px;
  }
  .jump h2 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 12px;
    color: #444;
  }
  .jump-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .jump-row .lbl {
    font-size: 14px;
    color: #666;
    min-width: 60px;
  }
  .pill {
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    border-radius: 999px;
    border: 1.5px solid #ccc;
    background: #fff;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pill:hover { border-color: #111; color: #111; }
  .pill.selected {
    background: #111;
    color: #fff;
    border-color: #111;
  }
  .jump-phase-row { gap: 10px; }
  .pill.action {
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
  }

  .end-banner {
    margin-top: 28px;
    padding: 32px 20px;
    border-radius: 16px;
    background: #111;
    color: #fff;
    text-align: center;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 700;
    line-height: 1.5;
    display: none;
  }
  .end-banner.show { display: block; }

  footer {
    text-align: center;
    margin-top: 32px;
    color: #999;
    font-size: 12px;
  }

  @media (max-width: 600px) {
    body { padding: 16px 12px 40px; }
    .timer-row { padding: 14px 16px; }
    .start-scheduled { grid-template-columns: 1fr; }
    .time-wheels { justify-content: center; padding: 8px 12px 4px; }
    .wheel { width: 76px; }
    .btn { padding: 16px; }
    .clock { font-size: 14px; padding: 4px 8px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="clock" id="clock">--:--:--</div>
  <header>
    <h1>東北大学医学部　医療面接タイマー<span style="font-size:0.55em;color:#666;font-weight:600;margin-left:8px;">（β / FBゆとり版）</span></h1>
    <div class="set-line">
      <span class="num" id="setNum">1</span> / 3 セット目
      <span class="phase idle" id="phaseTag">待機中</span>
    </div>
  </header>

  <div class="timers">
    <div class="timer-row" id="rowInterview">
      <div class="label">医療面接<span class="sub">10分間</span></div>
      <div class="time" id="timeInterview">10<span class="unit">分</span>00<span class="unit">秒</span></div>
    </div>
    <div class="timer-row" id="rowFeedback">
      <div class="label" id="fbLabel">フィードバック<span class="sub" id="fbSub">4分間</span></div>
      <div class="time" id="timeFeedback">04<span class="unit">分</span>00<span class="unit">秒</span></div>
      <div class="fb-bar" id="fbBar"><div class="fb-bar-fill" id="fbBarFill"></div></div>
    </div>
    <div class="timer-row" id="rowPrep">
      <div class="label">開始まで<span class="sub" id="prepSub">準備時間</span></div>
      <div class="time" id="timePrep">--<span class="unit">分</span>--<span class="unit">秒</span></div>
    </div>
  </div>

  <div class="controls">
    <div class="start-scheduled">
      <div class="time-wheels" id="timeWheels">
        <div class="wheel-col">
          <div class="wheel" id="wheelHour"><div class="wheel-list" id="wheelHourList"></div></div>
          <div class="wheel-label">時</div>
        </div>
        <span class="wheel-colon">:</span>
        <div class="wheel-col">
          <div class="wheel" id="wheelMin"><div class="wheel-list" id="wheelMinList"></div></div>
          <div class="wheel-label">分</div>
        </div>
      </div>
      <button class="btn primary" id="scheduledStartBtn">時刻を設定して開始</button>
    </div>
    <button class="btn secondary" id="nowStartBtn">今すぐ開始</button>
    <div class="ctrl-row">
      <button class="btn secondary" id="pauseBtn">ポーズ</button>
      <button class="btn secondary" id="resetBtn">リセット</button>
    </div>
  </div>
  <p class="until-info" id="untilInfo"></p>
  <p class="hint">設定した時刻ちょうどに医療面接が始まります（1分前にSP00アナウンス）</p>

  <div class="jump">
    <h2>途中からスタート</h2>
    <div class="jump-row">
      <span class="lbl">セット：</span>
      <button class="pill selected" data-set="1">1セット目</button>
      <button class="pill" data-set="2">2セット目</button>
      <button class="pill" data-set="3">3セット目</button>
    </div>
    <div class="jump-row jump-phase-row">
      <span class="lbl">開始：</span>
      <button class="pill action" data-jump="interview">医療面接開始から</button>
      <button class="pill action" data-jump="feedback">フィードバックから</button>
      <button class="pill action" data-jump="prep">準備から（2分）</button>
    </div>
  </div>

  <div class="end-banner" id="endBanner">
    医療面接の実習終了です。<br>お疲れ様でした。
  </div>

  <details class="jump" style="margin-top:18px;">
    <summary style="cursor:pointer; font-size:14px; color:#666; font-weight:600;">音声テスト / デバッグ</summary>
    <div class="jump-row" style="margin-top:10px;">
      <span class="lbl">単体再生：</span>
      <button class="pill" data-test="SP00">SP00</button>
      <button class="pill" data-test="SP1">SP1</button>
      <button class="pill" data-test="SP2">SP2</button>
      <button class="pill" data-test="SP3">SP3</button>
      <button class="pill" data-test="SP4">SP4</button>
      <button class="pill" data-test="SP5">SP5</button>
      <button class="pill" data-test="SP6">SP6</button>
      <button class="pill" data-test="BEEP">ピピ音</button>
      <button class="pill" data-test="CHIME">終了チャイム</button>
    </div>
    <pre id="debugLog" style="margin-top:10px; padding:10px; background:#f0f0f0; border-radius:6px; font-size:12px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all;"></pre>
  </details>

  <footer>
    東北大学医学部 SP医療面接（β版） ／
    <a href="index.html" style="color:#666;text-decoration:none;border-bottom:1px dotted #999;">通常版へ →</a>
  </footer>
</div>

<audio id="audSP00" src="SP00.wav" preload="auto" playsinline></audio>
<audio id="audSP1" src="SP1.m4a" preload="auto" playsinline></audio>
<audio id="audSP2" src="SP2.m4a" preload="auto" playsinline></audio>
<audio id="audSP3" src="SP3.m4a" preload="auto" playsinline></audio>
<audio id="audSP6" src="SP6.m4a" preload="auto" playsinline></audio>
<audio id="audSP4" src="SP4.m4a" preload="auto" playsinline></audio>
<audio id="audSP5" src="SP5.wav" preload="auto" playsinline></audio>

<script>
(function() {
  'use strict';

  // --- 設定 ---
  const PREP_FIRST = 60;        // セット1の準備時間（秒）
  const PREP_NORMAL = 120;      // セット2以降の準備時間（秒）
  const INTERVIEW_SEC = 10 * 60; // 医療面接（秒）
  const FEEDBACK_SEC = 4 * 60;  // フィードバック（秒）
  const FB_SP2_AT_REMAIN = 60;  // FB残り60秒でSP2を再生（=開始から3分）
  const WARNING_SECONDS = 60;   // 残り1分でオレンジ表示

  // --- 要素 ---
  const el = {
    setNum: document.getElementById('setNum'),
    phaseTag: document.getElementById('phaseTag'),
    rowInterview: document.getElementById('rowInterview'),
    rowFeedback: document.getElementById('rowFeedback'),
    rowPrep: document.getElementById('rowPrep'),
    timeInterview: document.getElementById('timeInterview'),
    timeFeedback: document.getElementById('timeFeedback'),
    timePrep: document.getElementById('timePrep'),
    prepSub: document.getElementById('prepSub'),
    fbLabel: document.getElementById('fbLabel'),
    fbSub: document.getElementById('fbSub'),
    fbBar: document.getElementById('fbBar'),
    fbBarFill: document.getElementById('fbBarFill'),
    scheduledStartBtn: document.getElementById('scheduledStartBtn'),
    nowStartBtn: document.getElementById('nowStartBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    resetBtn: document.getElementById('resetBtn'),
    endBanner: document.getElementById('endBanner'),
    clock: document.getElementById('clock'),
    timeWheels: document.getElementById('timeWheels'),
    wheelHour: document.getElementById('wheelHour'),
    wheelHourList: document.getElementById('wheelHourList'),
    wheelMin: document.getElementById('wheelMin'),
    wheelMinList: document.getElementById('wheelMinList'),
    untilInfo: document.getElementById('untilInfo'),
  };

  // 開始時刻設定値（ホイールピッカー）
  const scheduledTime = { h: 9, m: 0 };

  function createWheel(wheelEl, listEl, min, max, onChange) {
    const ITEM_H = 48;
    const items = [];
    listEl.innerHTML = '';
    for (let v = min; v <= max; v++) {
      const div = document.createElement('div');
      div.className = 'wheel-item';
      div.textContent = String(v).padStart(2, '0');
      div.dataset.value = v;
      listEl.appendChild(div);
      items.push(div);
    }
    function valueAtCurrent() {
      const idx = Math.round(wheelEl.scrollTop / ITEM_H);
      return Math.max(min, Math.min(max, min + idx));
    }
    function mark(v) {
      const i = v - min;
      items.forEach((it, k) => it.classList.toggle('selected', k === i));
    }
    let endTimer = null;
    wheelEl.addEventListener('scroll', () => {
      const v = valueAtCurrent();
      mark(v);
      if (endTimer) clearTimeout(endTimer);
      endTimer = setTimeout(() => onChange(v), 100);
    });
    // タップで直接選択
    items.forEach((it, i) => {
      it.addEventListener('click', () => {
        wheelEl.scrollTo({ top: i * ITEM_H, behavior: 'smooth' });
      });
    });
    return {
      setValue(v) {
        v = Math.max(min, Math.min(max, v));
        wheelEl.scrollTop = (v - min) * ITEM_H;
        mark(v);
      },
    };
  }

  const wheelH = createWheel(el.wheelHour, el.wheelHourList, 0, 23, v => { scheduledTime.h = v; });
  const wheelM = createWheel(el.wheelMin,  el.wheelMinList,  0, 59, v => { scheduledTime.m = v; });

  // --- 状態 ---
  // phase: 'idle' | 'scheduled' | 'prep' | 'interview' | 'feedback' | 'done'
  const state = {
    phase: 'idle',
    set: 1,            // 1..3
    remaining: 0,      // 秒
    endAt: null,       // running 時の終了予定（ms）
    running: false,
    sp2Played: false,  // フィードバック中SP2再生済みフラグ
    sp00Played: false, // 時刻指定スタート時のSP00再生済みフラグ
    jumpSet: 1,        // 途中スタート用のセット選択
    scheduledTargetMs: null, // 設定された医療面接開始時刻
  };

  // --- ユーティリティ ---
  function fmtParts(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return [String(m).padStart(2, '0'), String(s).padStart(2, '0')];
  }
  function setTimeEl(elTime, sec) {
    const [m, s] = fmtParts(sec);
    elTime.innerHTML = m + '<span class="unit">分</span>' + s + '<span class="unit">秒</span>';
  }
  function setPhaseTag() {
    const map = {
      idle: ['待機中', 'idle'],
      scheduled: ['開始時刻待ち', 'scheduled'],
      prep: ['準備時間', 'prep'],
      interview: ['医療面接', 'interview'],
      feedback: ['フィードバック', 'feedback'],
      done: ['終了', 'done'],
    };
    const [label, cls] = map[state.phase];
    el.phaseTag.textContent = label;
    el.phaseTag.className = 'phase ' + cls;
  }

  // --- デバッグログ ---
  function dlog(msg) {
    const d = document.getElementById('debugLog');
    if (!d) return;
    const ts = new Date().toLocaleTimeString('ja-JP', { hour12: false });
    d.textContent += '[' + ts + '] ' + msg + '\n';
    d.scrollTop = d.scrollHeight;
  }

  // --- 音声 ---
  // ピピ音は Web Audio API、SPアナウンスは HTML5 <audio>
  let audioCtx = null;
  const SP_KEYS = ['SP00', 'SP1', 'SP2', 'SP3', 'SP4', 'SP5', 'SP6'];
  const html5Audio = {};
  let html5Unlocked = false;

  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
  }

  function preloadAudio() {
    dlog('location=' + location.href);
    SP_KEYS.forEach(k => {
      const a = document.getElementById('aud' + k);
      html5Audio[k] = a;
      if (!a) { dlog(k + ' 要素なし'); return; }
      a.addEventListener('canplaythrough', () => dlog(k + ' canplaythrough (' + (a.duration ? a.duration.toFixed(2) + 's' : '?') + ')'), { once: true });
      a.addEventListener('error', () => {
        const err = a.error;
        dlog(k + ' load error: code=' + (err && err.code) + ' ' + (err && err.message || ''));
      });
      try { a.load(); } catch(e) {}
    });
  }

  function unlockAudio(excludeKey) {
    const ctx = getAudioCtx();
    if (ctx && ctx.state === 'suspended') {
      const p = ctx.resume();
      if (p && p.catch) p.catch(() => {});
    }
    if (html5Unlocked) return;
    html5Unlocked = true;
    // 各 audio 要素を muted で短く再生→停止 して iOS の自動再生制限を解除
    SP_KEYS.forEach(k => {
      if (k === excludeKey) return;
      const a = html5Audio[k];
      if (!a) return;
      a.muted = true;
      const p = a.play();
      if (p && p.then) {
        p.then(() => {
          try { a.pause(); a.currentTime = 0; } catch(e) {}
          a.muted = false;
        }).catch(() => { a.muted = false; });
      } else {
        try { a.pause(); a.currentTime = 0; } catch(e) {}
        a.muted = false;
      }
    });
    dlog('unlock 実行 (除外=' + (excludeKey || 'なし') + ')');
  }

  function playSP(key) {
    // この呼び出しが最初のユーザー操作の中なら、自分自身を除外して他をunlock
    unlockAudio(key);
    const a = html5Audio[key];
    if (!a) { dlog('playSP ' + key + ' 要素なし'); return; }
    a.muted = false;
    try { a.pause(); } catch(e) {}
    try { a.currentTime = 0; } catch(e) {}
    const p = a.play();
    if (p && p.then) {
      p.then(() => dlog('▶ ' + key + ' 再生開始 (rs=' + a.readyState + ')'))
       .catch(e => dlog('▶ ' + key + ' 再生失敗: ' + (e && e.message || e) + ' (rs=' + a.readyState + ', netState=' + a.networkState + ')'));
    } else {
      dlog('▶ ' + key + ' play() (rs=' + a.readyState + ')');
    }
  }

  function stopSP() {
    SP_KEYS.forEach(k => {
      const a = html5Audio[k];
      if (!a) return;
      try { a.pause(); a.currentTime = 0; } catch(e) {}
    });
  }

  function beep() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    for (let i = 0; i < 2; i++) {
      const t0 = now + i * 0.18;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0);
      o.stop(t0 + 0.15);
    }
  }

  function chime() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    // 上昇する3音の短いチャイム（C6 → E6 → G6）
    const notes = [
      { freq: 1047, t: 0.00, dur: 0.32 },
      { freq: 1319, t: 0.18, dur: 0.32 },
      { freq: 1568, t: 0.36, dur: 0.55 },
    ];
    notes.forEach(n => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = n.freq;
      const t0 = now + n.t;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0);
      o.stop(t0 + n.dur + 0.05);
    });
  }

  // --- 描画 ---
  function render() {
    el.setNum.textContent = state.set;
    setPhaseTag();

    // 各行のリセット
    [el.rowInterview, el.rowFeedback, el.rowPrep].forEach(r => r.classList.remove('active', 'warning'));
    el.rowFeedback.classList.remove('fb-mode');

    // タイマー値表示（active 以外は固定）
    const showInterview = state.phase === 'interview' ? state.remaining : INTERVIEW_SEC;
    const showFeedback = state.phase === 'feedback' ? state.remaining : FEEDBACK_SEC;
    let prepShow;
    if (state.phase === 'prep') prepShow = state.remaining;
    else if (state.phase === 'scheduled') prepShow = state.remaining;
    else prepShow = null;

    setTimeEl(el.timeInterview, showInterview);
    setTimeEl(el.timeFeedback, showFeedback);
    if (prepShow === null) {
      el.timePrep.innerHTML = '--<span class="unit">分</span>--<span class="unit">秒</span>';
    } else {
      setTimeEl(el.timePrep, prepShow);
    }

    // 準備時間サブ表示
    if (state.phase === 'scheduled') {
      el.prepSub.textContent = '医療面接開始まで';
    } else if (state.phase === 'prep') {
      el.prepSub.textContent = (state.set === 1 && currentPrepDuration() === PREP_FIRST) ? '医療面接開始まで' : '次の医療面接まで';
    } else {
      el.prepSub.textContent = '準備時間';
    }

    // active ハイライト
    if (state.phase === 'interview') el.rowInterview.classList.add('active');
    else if (state.phase === 'feedback') {
      el.rowFeedback.classList.add('active');
      // β版：フィードバック中はカウントダウンを隠してプログレスバーを表示
      el.rowFeedback.classList.add('fb-mode');
      el.fbLabel.firstChild.textContent = 'フィードバック中';
      el.fbSub.textContent = 'ご自身のペースで';
      const elapsed = FEEDBACK_SEC - state.remaining;
      const pct = Math.max(0, Math.min(100, (elapsed / FEEDBACK_SEC) * 100));
      el.fbBarFill.style.width = pct + '%';
    } else if (state.phase === 'prep' || state.phase === 'scheduled') el.rowPrep.classList.add('active');

    // FB行のラベル復元（FB中以外）
    if (state.phase !== 'feedback') {
      el.fbLabel.firstChild.textContent = 'フィードバック';
      el.fbSub.textContent = '4分間';
      el.fbBarFill.style.width = '0%';
    }

    // 警告色
    if (state.running && state.remaining <= WARNING_SECONDS) {
      if (state.phase === 'interview') el.rowInterview.classList.add('warning');
      else if (state.phase === 'feedback') el.rowFeedback.classList.add('warning');
      else if (state.phase === 'prep') el.rowPrep.classList.add('warning');
    }

    // ボタン状態
    const isIdle = state.phase === 'idle';
    if (isIdle) {
      el.scheduledStartBtn.disabled = false;
      el.nowStartBtn.disabled = false;
      el.pauseBtn.disabled = true;
      el.pauseBtn.textContent = 'ポーズ';
    } else if (state.phase === 'done') {
      el.scheduledStartBtn.disabled = true;
      el.nowStartBtn.disabled = true;
      el.pauseBtn.disabled = true;
    } else {
      el.scheduledStartBtn.disabled = true;
      el.nowStartBtn.disabled = true;
      // scheduledフェーズ中はポーズしない（目標時刻が動かないため）
      el.pauseBtn.disabled = (state.phase === 'scheduled');
      el.pauseBtn.textContent = state.running ? 'ポーズ' : '再開';
    }
    el.timeWheels.classList.toggle('disabled', !isIdle);

    // 終了バナー
    if (state.phase === 'done') el.endBanner.classList.add('show');
    else el.endBanner.classList.remove('show');

    // 開始までの案内テキスト
    updateUntilInfo();
  }

  function updateUntilInfo() {
    if (state.phase === 'scheduled' && state.scheduledTargetMs) {
      const diffSec = Math.max(0, Math.ceil((state.scheduledTargetMs - Date.now()) / 1000));
      const m = Math.floor(diffSec / 60);
      const s = diffSec % 60;
      const t = new Date(state.scheduledTargetMs);
      const hh = String(t.getHours()).padStart(2, '0');
      const mm = String(t.getMinutes()).padStart(2, '0');
      el.untilInfo.textContent = hh + ':' + mm + ' に医療面接開始（あと ' + m + '分' + String(s).padStart(2, '0') + '秒）';
    } else {
      el.untilInfo.textContent = '';
    }
  }

  function currentPrepDuration() {
    // 現在の prep 時間（idle→set1 開始時は60秒、それ以外は120秒）
    return state.set === 1 ? PREP_FIRST : PREP_NORMAL;
  }

  // --- フェーズ遷移 ---
  function enterPhase(phase, durationSec, opts) {
    opts = opts || {};
    state.phase = phase;
    state.remaining = durationSec;
    state.endAt = Date.now() + durationSec * 1000;
    state.running = true;
    state.sp2Played = false;
    if (opts.beep) beep();
    if (opts.sp) playSP(opts.sp);
    render();
  }

  function startSessionNow() {
    unlockAudio();
    state.set = 1;
    state.scheduledTargetMs = null;
    el.endBanner.classList.remove('show');
    // SP00 を流して、prep 1分 開始
    enterPhase('prep', PREP_FIRST, { sp: 'SP00' });
  }

  function startSessionScheduled() {
    const h = scheduledTime.h;
    const m = scheduledTime.m;
    const now = new Date();
    const target = new Date(now);
    target.setHours(h, m, 0, 0);
    let diffSec = (target.getTime() - now.getTime()) / 1000;

    if (diffSec <= 0) {
      alert('指定した時刻はすでに過ぎています。');
      return;
    }
    if (diffSec < PREP_FIRST + 1) {
      if (!confirm('開始まで1分未満です。今すぐ開始しますか？')) return;
      startSessionNow();
      return;
    }

    unlockAudio();
    state.set = 1;
    state.scheduledTargetMs = target.getTime();
    el.endBanner.classList.remove('show');
    // scheduled フェーズで設定時刻まで一本のカウントダウン。残り60秒で prep + SP00 に切替
    state.phase = 'scheduled';
    state.remaining = diffSec;
    state.endAt = target.getTime();
    state.running = true;
    state.sp2Played = false;
    state.sp00Played = false;
    render();
  }

  function onPhaseEnd() {
    // 現フェーズが0に達した時の遷移
    if (state.phase === 'scheduled') {
      // 通常は tick 内で残り60秒のときに prep へ遷移するためここには来ない。
      // フォールバック：そのまま医療面接へ
      enterPhase('interview', INTERVIEW_SEC, { beep: true, sp: 'SP4' });
    } else if (state.phase === 'prep') {
      // 準備 → 医療面接
      enterPhase('interview', INTERVIEW_SEC, { beep: true, sp: 'SP4' });
    } else if (state.phase === 'interview') {
      // 医療面接 → フィードバック
      enterPhase('feedback', FEEDBACK_SEC, { sp: 'SP1' });
    } else if (state.phase === 'feedback') {
      // フィードバック → 次セット準備 or 終了
      if (state.set >= 3) {
        state.phase = 'done';
        state.running = false;
        state.endAt = null;
        state.remaining = 0;
        chime();
        // チャイムの直後にSP5アナウンス
        setTimeout(() => playSP('SP5'), 1100);
        render();
      } else {
        state.set += 1;
        // β版：FB→次セット準備の合図は SP6 に変更（SP3から差し替え）
        enterPhase('prep', PREP_NORMAL, { beep: true, sp: 'SP6' });
      }
    }
  }

  // --- ボタン動作 ---
  function pauseToggle() {
    if (state.phase === 'idle' || state.phase === 'done') return;
    if (state.running) {
      // 一時停止
      state.remaining = Math.max(0, (state.endAt - Date.now()) / 1000);
      state.running = false;
      state.endAt = null;
    } else {
      // 再開
      state.endAt = Date.now() + state.remaining * 1000;
      state.running = true;
    }
    render();
  }

  function reset() {
    state.phase = 'idle';
    state.set = 1;
    state.remaining = 0;
    state.endAt = null;
    state.running = false;
    state.sp2Played = false;
    state.sp00Played = false;
    state.scheduledTargetMs = null;
    stopSP();
    render();
  }

  function jumpStart(phase) {
    unlockAudio();
    state.set = state.jumpSet;
    state.scheduledTargetMs = null;
    el.endBanner.classList.remove('show');
    if (phase === 'interview') {
      enterPhase('interview', INTERVIEW_SEC, {}); // 途中スタートはアナウンスなし
    } else if (phase === 'feedback') {
      enterPhase('feedback', FEEDBACK_SEC, {});
    } else if (phase === 'prep') {
      enterPhase('prep', PREP_NORMAL, {}); // 途中スタートのprepは2分
    }
  }

  // --- メインループ ---
  function tick() {
    if (!state.running) return;
    const remain = (state.endAt - Date.now()) / 1000;

    // β版：FB中のSP2アナウンス（残り1分警告）は廃止
    // 模擬患者から「カウントダウンされている感」が出るとの意見を反映

    // 時刻指定スタート：残り60秒を最初に下回ったら SP00 を流して prep へ遷移
    if (state.phase === 'scheduled' && !state.sp00Played && remain <= PREP_FIRST && remain > 0) {
      state.sp00Played = true;
      state.phase = 'prep';
      playSP('SP00');
      render();
    }

    if (remain <= 0) {
      state.remaining = 0;
      state.running = false;
      state.endAt = null;
      onPhaseEnd();
      return;
    }

    state.remaining = remain;

    // 表示更新（再描画は最小限）
    const target =
      state.phase === 'interview' ? el.timeInterview :
      state.phase === 'feedback' ? el.timeFeedback :
      (state.phase === 'prep' || state.phase === 'scheduled') ? el.timePrep : null;
    if (target) setTimeEl(target, remain);

    // β版：FB中はプログレスバーを滑らかに更新
    if (state.phase === 'feedback') {
      const elapsed = FEEDBACK_SEC - remain;
      const pct = Math.max(0, Math.min(100, (elapsed / FEEDBACK_SEC) * 100));
      el.fbBarFill.style.width = pct + '%';
    }

    // 警告色 toggle（scheduledは対象外）
    const targetRow =
      state.phase === 'interview' ? el.rowInterview :
      state.phase === 'feedback' ? el.rowFeedback :
      state.phase === 'prep' ? el.rowPrep : null;
    if (targetRow) {
      const want = remain <= WARNING_SECONDS;
      const has = targetRow.classList.contains('warning');
      if (want && !has) targetRow.classList.add('warning');
      else if (!want && has) targetRow.classList.remove('warning');
    }

    if (state.phase === 'scheduled') updateUntilInfo();
  }

  // --- イベント ---
  el.scheduledStartBtn.addEventListener('click', () => {
    if (state.phase === 'idle') startSessionScheduled();
  });
  el.nowStartBtn.addEventListener('click', () => {
    if (state.phase === 'idle') startSessionNow();
  });
  el.pauseBtn.addEventListener('click', pauseToggle);
  el.resetBtn.addEventListener('click', () => {
    if (state.phase !== 'idle' && state.phase !== 'done') {
      if (!confirm('タイマーをリセットしますか？')) return;
    }
    reset();
  });

  // 途中スタート セット選択
  document.querySelectorAll('.pill[data-set]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill[data-set]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.jumpSet = parseInt(btn.dataset.set, 10) || 1;
    });
  });
  // 途中スタート フェーズ選択
  document.querySelectorAll('.pill[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.phase !== 'idle' && state.phase !== 'done') {
        if (!confirm('現在のタイマーを中止して、選択した位置からスタートしますか？')) return;
      }
      jumpStart(btn.dataset.jump);
    });
  });

  // 音声テストボタン
  document.querySelectorAll('.pill[data-test]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.test;
      if (key === 'BEEP') { unlockAudio(); beep(); dlog('▶ BEEP'); }
      else if (key === 'CHIME') { unlockAudio(); chime(); dlog('▶ CHIME'); }
      else playSP(key);
    });
  });

  // --- Wake Lock（iPadスリープ防止）---
  let wakeLock = null;
  async function manageWakeLock() {
    if (state.running && !wakeLock && 'wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
    } else if (!state.running && wakeLock) {
      try { await wakeLock.release(); } catch(e) {}
      wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') manageWakeLock();
  });

  // --- 時計表示 ---
  function updateClock() {
    const n = new Date();
    const hh = String(n.getHours()).padStart(2, '0');
    const mm = String(n.getMinutes()).padStart(2, '0');
    const ss = String(n.getSeconds()).padStart(2, '0');
    el.clock.textContent = hh + ':' + mm + ':' + ss;
  }

  // --- 初期化 ---
  // 開始時刻のデフォルト：現在時刻＋10分（次の5分区切り）
  (function initStartTime() {
    const n = new Date();
    n.setMinutes(n.getMinutes() + 10);
    const m = Math.ceil(n.getMinutes() / 5) * 5;
    if (m >= 60) { n.setHours(n.getHours() + 1); n.setMinutes(0); }
    else n.setMinutes(m);
    scheduledTime.h = n.getHours();
    scheduledTime.m = n.getMinutes();
    requestAnimationFrame(() => {
      wheelH.setValue(scheduledTime.h);
      wheelM.setValue(scheduledTime.m);
    });
  })();

  updateClock();
  render();
  // 音声ファイルを事前読み込み（fetch + decodeAudioData）
  preloadAudio();
  setInterval(() => { tick(); manageWakeLock(); }, 200);
  setInterval(updateClock, 250);

})();
</script>
</body>
</html>
